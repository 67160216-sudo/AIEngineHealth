version: '3.8'

services:
  # 1. FastAPI Application Service
  course-api:
    build: .
    container_name: course-api-container
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: always

  # 2. MySQL Database Service
  db:
    image: mysql:8.0
    container_name: mysql-db-container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: engine_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # 3. phpMyAdmin Service
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin-container
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      - db

volumes:
  mysql_data:
