<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียน - AIEngineHealth</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="theme.css?v=20261003" rel="stylesheet">
</head>
<body>
<div class="auth-wrap">
    <div class="plate riveted auth-single" style="width:100%">
        <div class="brand" style="margin-bottom:24px">
            <div class="brand-mark"><i class="fa-solid fa-gears"></i></div>
            <span class="brand-name">AIEngineHealth</span>
        </div>

        <h1 style="font-size:24px">สร้างบัญชีใหม่</h1>
        <p class="muted small" style="margin-bottom:22px">ใช้บัญชีนี้บันทึกประวัติการตรวจเครื่องยนต์ของคุณ</p>

        <form id="registerForm" novalidate>
            <div class="field">
                <label for="fullname">ชื่อ-นามสกุล</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-id-card icon"></i>
                    <input type="text" id="fullname" class="input with-icon" autocomplete="name" placeholder="สมชาย ใจดี" required>
                </div>
            </div>

            <div class="field">
                <label for="username">ชื่อผู้ใช้</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-user icon"></i>
                    <input type="text" id="username" class="input with-icon" autocomplete="username"
                        placeholder="somchai" maxlength="50" required>
                </div>
                <p class="hint">ภาษาอังกฤษหรือตัวเลข 3–50 ตัว ใช้ . _ - @ ได้ (จะใช้อีเมลเป็นชื่อผู้ใช้ก็ได้)</p>
            </div>

            <div class="field">
                <label for="email">อีเมล</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-envelope icon"></i>
                    <input type="email" id="email" class="input with-icon" autocomplete="email" placeholder="somchai@example.com" required>
                </div>
            </div>

            <div class="field">
                <label for="password">รหัสผ่าน</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-key icon"></i>
                    <input type="password" id="password" class="input with-icon" autocomplete="new-password" required>
                </div>
                <p class="hint">อย่างน้อย 6 ตัวอักษร</p>
            </div>

            <div id="alertBox" class="alert hidden" role="alert" style="margin-bottom:14px"></div>

            <button type="submit" id="submitBtn" class="btn btn-primary btn-block">
                <i class="fa-solid fa-user-plus"></i>สร้างบัญชี
            </button>
        </form>

        <p class="small muted" style="margin-top:22px; text-align:center">
            มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a>
        </p>
    </div>
</div>

<script>
const form = document.getElementById('registerForm');
const alertBox = document.getElementById('alertBox');
const btn = document.getElementById('submitBtn');

function showAlert(type, msg) {
    alertBox.className = `alert ${type}`;
    alertBox.textContent = msg;
}

form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const full_name = document.getElementById('fullname').value.trim();
    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!full_name || !username || !email || !password) {
        showAlert('error', 'กรอกข้อมูลให้ครบทุกช่อง');
        return;
    }
    if (!/^[A-Za-z0-9_.@-]{3,50}$/.test(username)) {
        showAlert('error', 'ชื่อผู้ใช้ต้องเป็นภาษาอังกฤษหรือตัวเลข 3–50 ตัว ใช้ . _ - @ ได้ ห้ามมีช่องว่างหรือภาษาไทย');
        return;
    }
    if (password.length < 6) {
        showAlert('error', 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');
        return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>กำลังสร้างบัญชี...';

    try {
        const res = await fetch('register_proxy.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, email, full_name, password }),
        });
        const data = await res.json();

        if (res.ok) {
            showAlert('success', 'สร้างบัญชีแล้ว กำลังพาไปหน้าเข้าสู่ระบบ...');
            setTimeout(() => window.location.href = 'login.html', 1400);
            return;
        }
        let msg = data.detail;
        if (Array.isArray(msg)) msg = 'รูปแบบข้อมูลไม่ถูกต้อง ตรวจสอบอีเมลอีกครั้ง';
        showAlert('error', msg || 'สร้างบัญชีไม่สำเร็จ');
    } catch (err) {
        showAlert('error', 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ลองใหม่อีกครั้ง');
    }
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-user-plus"></i>สร้างบัญชี';
});
</script>
</body>
</html>
