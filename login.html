<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - AI Engine Health</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        
:root {
    --primary-color: #2563eb;
    --primary-hover: #1d4ed8;
    --success-color: #10b981;
    --warning-color: #f59e0b;
    --danger-color: #ef4444;
    --bg-color: #0f172a;
    --card-bg: #1e293b;
    --border-color: #334155;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Sarabun', sans-serif;
}

body {
    background-color: var(--bg-color);
    color: var(--text-main);
    line-height: 1.6;
    padding-bottom: 60px;
}

.navbar {
    background-color: var(--card-bg);
    border-bottom: 1px solid var(--border-color);
    padding: 15px 20px;
}

.navbar-container {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-weight: 700;
    font-size: 1.25rem;
    color: var(--text-main);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
}

.logo span {
    color: var(--primary-color);
}

.nav-links {
    display: flex;
    gap: 15px;
}

.nav-links a {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.9rem;
    padding: 6px 12px;
    border-radius: 6px;
    transition: all 0.2s;
}

.nav-links a.active {
    color: var(--text-main);
    background-color: var(--primary-color);
}

.nav-links a:hover:not(.active) {
    color: var(--text-main);
    background-color: rgba(255,255,255,0.05);
}

.container {
    max-width: 600px;
    margin: 50px auto;
    padding: 0 20px;
}

.card {
    background-color: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 30px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
}

.card-title {
    font-size: 1.5rem;
    margin-bottom: 20px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    font-size: 0.9rem;
    color: var(--text-muted);
    margin-bottom: 8px;
}

.form-group input, .form-group select {
    width: 100%;
    padding: 12px;
    background-color: #0f172a;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    color: var(--text-main);
    font-size: 1rem;
    transition: border-color 0.2s;
}

.form-group input:focus, .form-group select:focus {
    outline: none;
    border-color: var(--primary-color);
}

.btn {
    display: inline-block;
    width: 100%;
    padding: 14px;
    background-color: var(--primary-color);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    transition: background-color 0.2s;
}

.btn:hover {
    background-color: var(--primary-hover);
}

.footer {
    text-align: center;
    margin-top: 50px;
    font-size: 0.85rem;
    color: var(--text-muted);
}

        .auth-switch {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .auth-switch a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }
        .auth-switch a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="page1_register.html" class="logo"><i class="fas fa-brain"></i> AI <span>Engine Health</span></a>
            <div class="nav-links">
                <a href="page0_login.html" class="active">เข้าสู่ระบบ</a>
                <a href="page1_register.html">สมัครใช้งาน</a>
            </div>
        </div>
    </nav>
    
    <div class="container">
        <div class="card">
            <div class="card-title">
                <i class="fas fa-sign-in-alt" style="color: var(--primary-color);"></i> เข้าสู่ระบบใช้งาน
            </div>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 25px;">
                ยินดีต้อนรับกลับมา! กรุณากรอกข้อมูลบัญชีผู้ใช้ของคุณเพื่อตรวจสอบสถานะสุขภาพเครื่องยนต์ล่าสุด
            </p>
            
            <form action="page2_car_info.html">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> อีเมลผู้ใช้งาน</label>
                    <input type="email" placeholder="somchai@example.com" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> รหัสผ่าน</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <div class="form-group" style="display: flex; justify-content: space-between; align-items: center; margin-top: -5px;">
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <input type="checkbox" id="remember" style="width: auto;">
                        <label for="remember" style="margin-bottom: 0; cursor: pointer;">จดจำฉันไว้</label>
                    </div>
                    <a href="#" style="color: var(--text-muted); font-size: 0.85rem; text-decoration: none;">ลืมรหัสผ่าน?</a>
                </div>
                
                <button type="submit" class="btn">เข้าสู่ระบบ <i class="fas fa-arrow-right"></i></button>
            </form>
            
            <div class="auth-switch">
                ยังไม่มีบัญชีผู้ใช้งาน? <a href="page1_register.html">สมัครใช้งานที่นี่</a>
            </div>
        </div>
        <div class="footer">
            &copy; 2026 AI Engine Health Prediction. All rights reserved.
        </div>
    </div>
</body>
</html>
