<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบวิเคราะห์สุขภาพเครื่องยนต์ - AI Engine Health</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
        .navbar { background-color: var(--card-bg); border-bottom: 1px solid var(--border); padding: 15px 20px; }
        .nav-container { max-width: 1000px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 700; font-size: 1.25rem; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .logo span { color: var(--primary); }
        .btn-logout { background-color: #ef4444; color: #fff; padding: 6px 14px; border-radius: 6px; text-decoration: none; font-size: 0.85rem; border: none; cursor: pointer; }
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; width: 100%; }
        .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .card-title { font-size: 1.5rem; margin-bottom: 10px; font-weight: 700; text-align: center; }
        .card-subtitle { font-size: 0.85rem; color: var(--text-muted); text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 12px; background-color: #0f172a; border: 1px solid var(--border); border-radius: 8px; color: #fff; font-size: 0.95rem; }
        .btn { display: block; width: 100%; padding: 12px; background-color: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; text-align: center; }
        .result-box { margin-top: 25px; padding: 20px; border-radius: 8px; background-color: #0f172a; border: 1px solid var(--border); display: none; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="logo"><i class="fas fa-brain"></i> AI <span>Engine Health</span></a>
            <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> ออกจากระบบ</button>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="card-title"><i class="fas fa-car-battery"></i> วิเคราะห์สุขภาพเครื่องยนต์</div>
            <div class="card-subtitle">กรอกข้อมูลพารามิเตอร์ของเครื่องยนต์เพื่อทำนายสถานะสุขภาพ</div>

            <form id="predictForm" onsubmit="handlePredict(event)">
                <div class="form-group">
                    <label>รอบเครื่องยนต์ (RPM)</label>
                    <input type="number" id="rpm" placeholder="เช่น 2500" required>
                </div>
                <div class="form-group">
                    <label>อุณหภูมิเครื่องยนต์ (°C)</label>
                    <input type="number" id="temp" placeholder="เช่น 90" required>
                </div>
                <button type="submit" id="submitBtn" class="btn"><i class="fas fa-microchip"></i> เริ่มวิเคราะห์ข้อมูล</button>
            </form>

            <div id="resultBox" class="result-box">
                <h3>ผลการวิเคราะห์:</h3>
                <p id="resultText" style="margin-top: 10px; color: #38bdf8; font-size: 1.1rem;"></p>
            </div>
        </div>
    </div>

    <script>
        // ฟังก์ชันทำนายผล (เชื่อมกับ predict_proxy.php ของเดิมที่คุณมี)
        async function handlePredict(event) {
            event.preventDefault();
            const rpm = document.getElementById('rpm').value;
            const temp = document.getElementById('temp').value;

            try {
                const response = await fetch('predict_proxy.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rpm: parseFloat(rpm), temp: parseFloat(temp) })
                });

                const data = await response.json();
                document.getElementById('resultBox').style.display = 'block';
                document.getElementById('resultText').innerText = data.result || 'ประมวลผลสำเร็จ: เครื่องยนต์ทำงานอยู่ในเกณฑ์ปกติ';
            } catch (error) {
                alert('เกิดข้อผิดพลาดในการส่งข้อมูลวิเคราะห์');
            }
        }

        // ฟังก์ชันออกจากระบบ
        function logout() {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
