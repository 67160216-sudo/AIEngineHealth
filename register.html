<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก - AI Engine Health</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
        .navbar { background-color: var(--card-bg); border-bottom: 1px solid var(--border); padding: 15px 20px; }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 700; font-size: 1.25rem; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .logo span { color: var(--primary); }
        .nav-links a { color: var(--text-muted); text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: 0.9rem; margin-left: 10px; }
        .nav-links a.active { background-color: var(--primary); color: #fff; }
        .container { max-width: 480px; margin: 40px auto; padding: 0 20px; width: 100%; }
        .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .card-title { font-size: 1.5rem; margin-bottom: 10px; font-weight: 700; text-align: center; }
        .card-subtitle { font-size: 0.85rem; color: var(--text-muted); text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 12px; background-color: #0f172a; border: 1px solid var(--border); border-radius: 8px; color: #fff; font-size: 0.95rem; }
        .form-group input:focus { outline: none; border-color: var(--primary); }
        .btn { display: block; width: 100%; padding: 12px; background-color: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; }
        .btn:hover { background-color: #1d4ed8; }
        .switch-auth { text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--text-muted); }
        .switch-auth a { color: var(--primary); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="logo"><i class="fas fa-brain"></i> AI <span>Engine Health</span></a>
            <div class="nav-links">
                <a href="login.html">เข้าสู่ระบบ</a>
                <a href="register.html" class="active">สมัครสมาชิก</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="card-title"><i class="fas fa-user-plus"></i> สมัครสมาชิกใหม่</div>
            <div class="card-subtitle">สร้างบัญชีผู้ใช้งานสำหรับลงทะเบียนและทำนายสุขภาพรถยนต์</div>
            
            <form action="prediction.html">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> ชื่อ-นามสกุล</label>
                    <input type="text" placeholder="สมชาย สุขใจ" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> อีเมล</label>
                    <input type="email" placeholder="student@university.ac.th" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> รหัสผ่าน</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <div class="form-group" style="display: flex; gap: 8px; align-items: center; font-size: 0.85rem;">
                    <input type="checkbox" id="terms" style="width: auto;" required>
                    <label for="terms" style="margin: 0; cursor: pointer;">ฉันยอมรับเงื่อนไขการใช้งานและนโยบายข้อมูล</label>
                </div>
                <button type="submit" class="btn">ลงทะเบียนผู้ใช้ <i class="fas fa-check"></i></button>
            </form>

            <div class="switch-auth">
                มีบัญชีผู้ใช้งานอยู่แล้ว? <a href="login.html">เข้าสู่ระบบที่นี่</a>
            </div>
        </div>
    </div>
</body>
</html>
