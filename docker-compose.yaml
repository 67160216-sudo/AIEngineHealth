version: '3.8'

services:
  # 1. Database Service (PostgreSQL)
  postgres_db:
    image: postgres:15-alpine
    container_name: ai_engine_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: ai_engine_health_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. REST API Service (Node.js / Express)
  api_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_engine_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://admin:secretpassword@postgres_db:5432/ai_engine_health_db
      JWT_SECRET: my_super_secret_jwt_key
      AI_SERVICE_URL: http://ai_service:5000
    depends_on:
      - postgres_db

  # 3. AI Prediction Service (Python / FastAPI)
  ai_service:
    image: python:3.10-slim
    container_name: ai_engine_ml
    restart: always
    working_dir: /app
    command: sh -c "pip install fastapi uvicorn scikit-learn pandas && uvicorn main:app --host 0.0.0.0 --port 5000"
    ports:
      - "5000:5000"

volumes:
  pgdata: